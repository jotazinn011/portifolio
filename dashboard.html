<script>
  // ==========================================
  // CONFIGURAÇÃO DO SUPABASE
  // ==========================================

  const SUPABASE_URL = "https://eyxvayeaukvjuqayekch.supabase.co";

  const SUPABASE_KEY = "sb_publishable_VLI4uJG-UFaB_YPHlHA5JA_C5_-zxEw";

  // Elementos da página
  const projectForm = document.getElementById("projectForm");
  const formTitle = document.getElementById("formTitle");
  const btnCancel = document.getElementById("btnCancel");
  const projectIdInput = document.getElementById("projectId");
  const tableBody = document.getElementById("projectsTableBody");

  // ==========================================
  // ÁREA DE STATUS
  // ==========================================

  const statusBox = document.createElement("div");

  statusBox.style.marginBottom = "20px";
  statusBox.style.padding = "12px 15px";
  statusBox.style.borderRadius = "6px";
  statusBox.style.fontWeight = "600";
  statusBox.style.display = "block";
  statusBox.style.backgroundColor = "#e2e8f0";
  statusBox.style.color = "#334155";
  statusBox.textContent = "Iniciando conexão com o Supabase...";

  document
    .querySelector(".main-content")
    .insertBefore(statusBox, document.querySelector(".main-content").children[1]);

  function mostrarStatus(mensagem, tipo = "info") {

    statusBox.textContent = mensagem;

    if (tipo === "sucesso") {
      statusBox.style.backgroundColor = "#dcfce7";
      statusBox.style.color = "#166534";
    }

    if (tipo === "erro") {
      statusBox.style.backgroundColor = "#fee2e2";
      statusBox.style.color = "#991b1b";
    }

    if (tipo === "info") {
      statusBox.style.backgroundColor = "#e2e8f0";
      statusBox.style.color = "#334155";
    }
  }

  // ==========================================
  // CONECTAR AO SUPABASE
  // ==========================================

  let supabase;

  try {

    if (!window.supabase) {
      throw new Error(
        "A biblioteca do Supabase não foi carregada."
      );
    }

    supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    mostrarStatus(
      "Biblioteca do Supabase carregada. Testando conexão...",
      "info"
    );

  } catch (erro) {

    console.error(erro);

    mostrarStatus(
      "ERRO AO INICIAR SUPABASE: " + erro.message,
      "erro"
    );
  }

  // ==========================================
  // TESTAR BANCO E CARREGAR PROJETOS
  // ==========================================

  async function loadProjects() {

    if (!supabase) {
      mostrarStatus(
        "Supabase não foi inicializado.",
        "erro"
      );
      return;
    }

    mostrarStatus(
      "Conectando ao banco de dados...",
      "info"
    );

    try {

      const { data, error } = await supabase
        .from("projetos")
        .select("*")
        .order("id", { ascending: true });

      if (error) {

        console.error("Erro do Supabase:", error);

        tableBody.innerHTML = `
          <tr>
            <td colspan="6"
              style="text-align:center;color:red;">
              Erro ao carregar: ${error.message}
            </td>
          </tr>
        `;

        mostrarStatus(
          "ERRO NO SUPABASE: " + error.message,
          "erro"
        );

        return;
      }

      mostrarStatus(
        "Conexão com o Supabase funcionando!",
        "sucesso"
      );

      if (!data || data.length === 0) {

        tableBody.innerHTML = `
          <tr>
            <td colspan="6"
              style="text-align:center;">
              Nenhum projeto cadastrado.
            </td>
          </tr>
        `;

        return;
      }

      tableBody.innerHTML = "";

      data.forEach((p) => {

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${p.id}</td>

          <td>
            ${
              p.img
                ? `<img src="${p.img}"
                    class="img-preview"
                    alt="Preview">`
                : "-"
            }
          </td>

          <td>
            <strong>${escapeHtml(p.nome || "")}</strong>
          </td>

          <td>
            ${escapeHtml(p.descricao || "-")}
          </td>

          <td>
            ${
              p.link
                ? `<a href="${p.link}"
                    target="_blank"
                    rel="noopener noreferrer">
                    Acessar
                  </a>`
                : "-"
            }
          </td>

          <td class="actions-cell">

            <button
              class="btn btn-edit"
              onclick="editProject(
                ${p.id},
                '${escapeHtml(p.nome || "")}',
                '${escapeHtml(p.descricao || "")}',
                '${escapeHtml(p.img || "")}',
                '${escapeHtml(p.link || "")}'
              )">
              Editar
            </button>

            <button
              class="btn btn-danger"
              onclick="deleteProject(${p.id})">
              Excluir
            </button>

          </td>
        `;

        tableBody.appendChild(row);
      });

    } catch (erro) {

      console.error("Erro inesperado:", erro);

      mostrarStatus(
        "ERRO DE CONEXÃO: " + erro.message,
        "erro"
      );
    }
  }

  // ==========================================
  // SALVAR / ATUALIZAR PROJETO
  // ==========================================

  projectForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    if (!supabase) {

      mostrarStatus(
        "Supabase não está conectado.",
        "erro"
      );

      return;
    }

    const id = projectIdInput.value;

    const nome =
      document.getElementById("nome").value.trim();

    const descricao =
      document.getElementById("descricao").value.trim();

    const img =
      document.getElementById("img").value.trim();

    const link =
      document.getElementById("link").value.trim();

    const projectData = {
      nome: nome,
      descricao: descricao,
      img: img,
      link: link
    };

    mostrarStatus(
      "Enviando projeto para o Supabase...",
      "info"
    );

    try {

      // ========================================
      // ATUALIZAR
      // ========================================

      if (id) {

        const { error } = await supabase
          .from("projetos")
          .update(projectData)
          .eq("id", id);

        if (error) {

          console.error("Erro ao atualizar:", error);

          mostrarStatus(
            "ERRO AO ATUALIZAR: " + error.message,
            "erro"
          );

          return;
        }

        mostrarStatus(
          "Projeto atualizado com sucesso!",
          "sucesso"
        );

      }

      // ========================================
      // INSERIR
      // ========================================

      else {

        const { data, error } = await supabase
          .from("projetos")
          .insert([projectData])
          .select();

        if (error) {

          console.error("Erro ao cadastrar:", error);

          mostrarStatus(
            "ERRO AO CADASTRAR: " + error.message,
            "erro"
          );

          return;
        }

        console.log("Projeto criado:", data);

        mostrarStatus(
          "PROJETO SALVO NO SUPABASE COM SUCESSO!",
          "sucesso"
        );
      }

      resetForm();

      await loadProjects();

    } catch (erro) {

      console.error("Erro inesperado:", erro);

      mostrarStatus(
        "ERRO INESPERADO: " + erro.message,
        "erro"
      );
    }
  });

  // ==========================================
  // EDITAR
  // ==========================================

  function editProject(
    id,
    nome,
    descricao,
    img,
    link
  ) {

    formTitle.textContent =
      "Editar Projeto #" + id;

    projectIdInput.value = id;

    document.getElementById("nome").value = nome;

    document.getElementById("descricao").value =
      descricao;

    document.getElementById("img").value =
      img;

    document.getElementById("link").value =
      link;

    btnCancel.style.display =
      "inline-block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  // ==========================================
  // EXCLUIR
  // ==========================================

  async function deleteProject(id) {

    if (
      !confirm(
        `Tem certeza que deseja excluir o projeto #${id}?`
      )
    ) {
      return;
    }

    try {

      const { error } = await supabase
        .from("projetos")
        .delete()
        .eq("id", id);

      if (error) {

        mostrarStatus(
          "ERRO AO EXCLUIR: " + error.message,
          "erro"
        );

        return;
      }

      mostrarStatus(
        "Projeto excluído com sucesso!",
        "sucesso"
      );

      await loadProjects();

    } catch (erro) {

      mostrarStatus(
        "ERRO: " + erro.message,
        "erro"
      );
    }
  }

  // ==========================================
  // RESETAR FORMULÁRIO
  // ==========================================

  function resetForm() {

    formTitle.textContent =
      "Adicionar Novo Projeto";

    projectIdInput.value = "";

    projectForm.reset();

    btnCancel.style.display =
      "none";
  }

  // ==========================================
  // ESCAPAR TEXTO
  // ==========================================

  function escapeHtml(text) {

    return String(text)
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }

  // ==========================================
  // INICIAR
  // ==========================================

  loadProjects();

</script>
